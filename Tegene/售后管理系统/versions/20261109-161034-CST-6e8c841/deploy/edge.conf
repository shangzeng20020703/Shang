# Install only this vhost in the existing edge proxy. Validate before graceful reload.
server {
  listen 80;
  server_name sh.tegene.com;
  access_log off;
  location ^~ /.well-known/acme-challenge/ {
    root /webroot/acme;
    default_type text/plain;
    try_files $uri =404;
  }
  location / { return 301 https://sh.tegene.com$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name sh.tegene.com;
  ssl_certificate /data/nginx/certs/live/sh.tegene.com/fullchain.pem;
  ssl_certificate_key /data/nginx/certs/live/sh.tegene.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 20m;
  access_log off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  location / {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $aftersales_upstream aftersales-web-1:80;
    proxy_pass http://$aftersales_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
}
